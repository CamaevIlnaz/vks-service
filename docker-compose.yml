services:
  postgres:
    image: postgres:18.7
    container_name: vks-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vks
      POSTGRES_PASSWORD: vks
      POSTGRES_DB: vks
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vks -d vks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: vks-postgres-data
