services:
  postgres:
    image: postgres:18.7
    container_name: vks-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vks}
      POSTGRES_DB: ${POSTGRES_DB:-vks}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-vks} -d ${POSTGRES_DB:-vks}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: vks-postgres-data
